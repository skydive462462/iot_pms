<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Vitals Monitor</title>
<style>
  :root{
    --bg:#050706; --panel:#0c1210; --panel-line:#1c2622;
    --text:#dce7e2; --text-dim:#6f8b83;
    --bpm:#3ef58a; --temp:#ffb648; --bad:#ff5d5d; --off:#2a3530;
    --mono:"IBM Plex Mono","SFMono-Regular",Consolas,monospace;
    --sans:"IBM Plex Sans",-apple-system,"Segoe UI",sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{background:var(--bg);color:var(--text);font-family:var(--sans);
    display:flex;align-items:center;justify-content:center;padding:24px;}
  .wrap{width:100%;max-width:380px;}
  .brand{display:flex;align-items:center;gap:10px;margin-bottom:28px;}
  .brand-mark{width:10px;height:10px;border-radius:50%;background:var(--bpm);
    box-shadow:0 0 8px var(--bpm);animation:pulse 1.4s infinite ease-in-out;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.35;}}
  .brand-name{font-family:var(--mono);font-size:14px;letter-spacing:.04em;color:var(--text-dim);}
  .card{background:var(--panel);border:1px solid var(--panel-line);border-radius:4px;padding:28px;}
  .card h1{font-size:20px;margin:0 0 4px;font-weight:600;}
  .card p.sub{margin:0 0 24px;color:var(--text-dim);font-size:13px;line-height:1.5;}
  label{display:block;font-size:12px;color:var(--text-dim);margin-bottom:6px;}
  .field{margin-bottom:16px;}
  input{width:100%;background:#060a09;border:1px solid var(--panel-line);color:var(--text);
    border-radius:3px;padding:10px 12px;font-size:14px;font-family:var(--sans);}
  input:focus{outline:none;border-color:var(--bpm);}
  button.primary{width:100%;background:var(--bpm);color:#04140a;border:none;border-radius:3px;
    padding:11px 12px;font-size:14px;font-weight:600;cursor:pointer;margin-top:6px;}
  button.primary:hover{filter:brightness(1.08);}
  button.primary:disabled{opacity:.5;cursor:not-allowed;}
  .result{margin-top:18px;padding:12px 14px;border-radius:3px;font-size:13.5px;
    font-family:var(--mono);display:none;}
  .result.bad{display:block;background:rgba(255,93,93,.08);border:1px solid rgba(255,93,93,.4);color:var(--bad);}

  .dash-wrap{display:none;width:100%;max-width:560px;}
  .dash-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;}
  .dash-header .who{font-size:12.5px;color:var(--text-dim);}
  .dash-header .who span{color:var(--text);}
  .logout-btn{background:none;border:1px solid var(--panel-line);color:var(--text-dim);
    font-size:12px;padding:6px 12px;border-radius:3px;cursor:pointer;}
  .logout-btn:hover{color:var(--text);border-color:var(--text-dim);}

  .vitals-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px;}
  .vital-card{background:var(--panel);border:1px solid var(--panel-line);border-radius:4px;padding:20px;}
  .vital-label{font-size:11.5px;color:var(--text-dim);margin-bottom:10px;}
  .vital-value{font-family:var(--mono);font-size:40px;line-height:1;font-weight:500;}
  .vital-value .unit{font-size:16px;color:var(--text-dim);margin-left:4px;}
  .vital-value.bpm{color:var(--bpm);}
  .vital-value.temp{color:var(--temp);}
  .vital-updated{font-size:11px;color:var(--text-dim);margin-top:10px;font-family:var(--mono);}

  .controls-card{background:var(--panel);border:1px solid var(--panel-line);border-radius:4px;padding:20px;}
  .controls-title{font-size:11.5px;color:var(--text-dim);margin-bottom:16px;}
  .control-row{display:flex;align-items:center;justify-content:space-between;padding:12px 0;
    border-top:1px solid var(--panel-line);}
  .control-row:first-of-type{border-top:none;padding-top:0;}
  .control-label{display:flex;align-items:center;gap:10px;font-size:14px;}
  .indicator{width:14px;height:14px;border-radius:50%;background:var(--off);
    transition:background .15s,box-shadow .15s;}
  .indicator.buzzer-on{background:var(--bad);box-shadow:0 0 10px var(--bad);}
  .indicator.led-on{background:#ffe066;box-shadow:0 0 10px #ffe066;}
  .toggle{position:relative;width:44px;height:24px;background:var(--off);border-radius:12px;
    border:none;cursor:pointer;transition:background .15s;}
  .toggle::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;
    background:var(--text);border-radius:50%;transition:transform .15s;}
  .toggle.on{background:var(--bpm);}
  .toggle.on::after{transform:translateX(20px);background:#04140a;}

  .conn-status{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--text-dim);margin-top:16px;}
  .conn-dot{width:7px;height:7px;border-radius:50%;background:var(--text-dim);}
  .conn-dot.live{background:var(--bpm);box-shadow:0 0 6px var(--bpm);}
  .conn-dot.stale{background:var(--bad);}

  @media (max-width:420px){.vitals-grid{grid-template-columns:1fr;}}
</style>
</head>
<body>

<div id="authWrap" class="wrap">
  <div class="brand"><div class="brand-mark"></div><div class="brand-name">VITALS MONITOR</div></div>
  <div class="card">
    <h1>Sign in</h1>
    <p class="sub">Enter the credentials you were given to view live vitals.</p>
    <div class="field"><label for="username">Username</label>
      <input type="text" id="username" autocomplete="username" placeholder="Username" /></div>
    <div class="field"><label for="password">Password</label>
      <input type="password" id="password" autocomplete="current-password" placeholder="Password" /></div>
    <button class="primary" id="loginBtn">Sign in</button>
    <div class="result bad" id="result"></div>
  </div>
</div>

<div id="dashWrap" class="dash-wrap">
  <div class="dash-header">
    <div class="who">Signed in as <span>patient_vital</span></div>
    <button class="logout-btn" id="logoutBtn">Sign out</button>
  </div>

  <div class="vitals-grid">
    <div class="vital-card">
      <div class="vital-label">HEART RATE</div>
      <div class="vital-value bpm"><span id="bpmValue">--</span><span class="unit">bpm</span></div>
      <div class="vital-updated" id="bpmUpdated">no data yet</div>
    </div>
    <div class="vital-card">
      <div class="vital-label">TEMPERATURE</div>
      <div class="vital-value temp"><span id="tempValue">--</span><span class="unit">°C</span></div>
      <div class="vital-updated" id="tempUpdated">no data yet</div>
    </div>
  </div>

  <div class="controls-card">
    <div class="controls-title">DEVICE CONTROLS</div>
    <div class="control-row">
      <div class="control-label"><div class="indicator" id="buzzerIndicator"></div>Buzzer</div>
      <button class="toggle" id="buzzerToggle"></button>
    </div>
    <div class="control-row">
      <div class="control-label"><div class="indicator" id="ledIndicator"></div>LED</div>
      <button class="toggle" id="ledToggle"></button>
    </div>
  </div>

  <div class="conn-status"><div class="conn-dot" id="connDot"></div><span id="connLabel">Connecting…</span></div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getAuth, signInAnonymously, onAuthStateChanged }
    from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import { getDatabase, ref, onValue, set }
    from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

  // ---- 1. REPLACE with your own Firebase project config ----
  const firebaseConfig = {
    apiKey: "AIzaSyDM5_3qmJVfWc9kF6qHBf4ojWbym4PyX4A",
    authDomain: "netvital.firebaseapp.com",
    databaseURL: "https://netvital-default-rtdb.asia-southeast1.firebasedatabase.app/",
    projectId: "netvital",
    appId: "1:305975124083:web:b9f5ec7adc1497766d0a06"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getDatabase(app);

  // ---- Your custom login gate (not Firebase Auth) ----
  const MOCK_USERNAME = "patient_vital";
  const MOCK_PASSWORD = "iotwork462";

  const authWrap = document.getElementById("authWrap");
  const dashWrap = document.getElementById("dashWrap");
  const usernameInput = document.getElementById("username");
  const passwordInput = document.getElementById("password");
  const loginBtn = document.getElementById("loginBtn");
  const result = document.getElementById("result");
  const logoutBtn = document.getElementById("logoutBtn");

  loginBtn.addEventListener("click", handleLogin);
  passwordInput.addEventListener("keydown", (e) => { if (e.key === "Enter") handleLogin(); });

  async function handleLogin(){
    const u = usernameInput.value.trim();
    const p = passwordInput.value;
    if (u !== MOCK_USERNAME || p !== MOCK_PASSWORD) {
      result.style.display = "block";
      result.textContent = "✘ Incorrect username or password.";
      return;
    }
    result.style.display = "none";
    loginBtn.disabled = true;
    try {
      // Get a real Firebase identity behind the scenes so the database
      // rules (auth != null) let this browser read/write.
      await signInAnonymously(auth);
    } catch (err) {
      result.style.display = "block";
      result.textContent = "Could not connect to the database. Check your Firebase config.";
      console.error(err);
    } finally {
      loginBtn.disabled = false;
    }
  }

  logoutBtn.addEventListener("click", () => {
    auth.signOut();
    dashWrap.style.display = "none";
    authWrap.style.display = "block";
    usernameInput.value = "";
    passwordInput.value = "";
  });

  onAuthStateChanged(auth, (user) => {
    if (user) {
      authWrap.style.display = "none";
      dashWrap.style.display = "block";
      attachVitalsListener();
      attachControlsListener();
    }
  });

  // ---- Live vitals from /vitals ----
  const bpmValue = document.getElementById("bpmValue");
  const tempValue = document.getElementById("tempValue");
  const bpmUpdated = document.getElementById("bpmUpdated");
  const tempUpdated = document.getElementById("tempUpdated");
  const connDot = document.getElementById("connDot");
  const connLabel = document.getElementById("connLabel");
  let vitalsAttached = false;

  function timeAgo(ts){
    if (!ts) return "no data yet";
    const s = Math.floor((Date.now() - ts) / 1000);
    if (s < 60) return `${s}s ago`;
    if (s < 3600) return `${Math.floor(s/60)}m ago`;
    return `${Math.floor(s/3600)}h ago`;
  }

  function attachVitalsListener(){
    if (vitalsAttached) return;
    vitalsAttached = true;
    onValue(ref(db, "vitals"), (snap) => {
      const data = snap.val();
      if (!data) { connDot.className = "conn-dot stale"; connLabel.textContent = "No data at /vitals yet."; return; }
      bpmValue.textContent = data.bpm ?? "--";
      tempValue.textContent = (data.temp !== undefined) ? Number(data.temp).toFixed(1) : "--";
      bpmUpdated.textContent = timeAgo(data.timestamp);
      tempUpdated.textContent = timeAgo(data.timestamp);
      const age = data.timestamp ? Date.now() - data.timestamp : Infinity;
      if (age < 15000) { connDot.className = "conn-dot live"; connLabel.textContent = "Live"; }
      else { connDot.className = "conn-dot stale"; connLabel.textContent = "Last reading is stale"; }
    }, (err) => {
      connDot.className = "conn-dot stale";
      connLabel.textContent = "Database read failed — check rules/config.";
      console.error(err);
    });
  }

  // ---- Controls: write to /controls, and reflect current state on load ----
  const buzzerToggle = document.getElementById("buzzerToggle");
  const ledToggle = document.getElementById("ledToggle");
  const buzzerIndicator = document.getElementById("buzzerIndicator");
  const ledIndicator = document.getElementById("ledIndicator");
  let controlsAttached = false;

  function attachControlsListener(){
    if (controlsAttached) return;
    controlsAttached = true;
    onValue(ref(db, "controls"), (snap) => {
      const data = snap.val() || {};
      buzzerToggle.classList.toggle("on", !!data.buzzer);
      buzzerIndicator.classList.toggle("buzzer-on", !!data.buzzer);
      ledToggle.classList.toggle("on", !!data.led);
      ledIndicator.classList.toggle("led-on", !!data.led);
    });
  }

  buzzerToggle.addEventListener("click", () => {
    const next = !buzzerToggle.classList.contains("on");
    set(ref(db, "controls/buzzer"), next);
  });
  ledToggle.addEventListener("click", () => {
    const next = !ledToggle.classList.contains("on");
    set(ref(db, "controls/led"), next);
  });
</script>
</body>
</html>
